  <link rel="preconnect" href="https://fonts.googleapis.com">

  <!-- Bibliotecas com versão fixa (SPEC 3.1). Nunca usar @latest. -->
  <script type="importmap">
  {
    "imports": {
      "@supabase/supabase-js": "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2/+esm",
      "marked": "https://cdn.jsdelivr.net/npm/marked@18.0.14/lib/marked.esm.js",
      "dompurify": "https://cdn.jsdelivr.net/npm/dompurify@3.4.16/dist/purify.es.mjs",
      "html2canvas": "https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/+esm"
    }
  }

<body data-state="loading">
  <a class="skip-link" href="#main">Pular para o conteúdo</a>

  <header class="topbar">
    <a class="brand" href="#/" aria-label="Bloodlines, Central da Staff: início">
      <svg class="brand-mark" viewBox="0 0 24 24" aria-hidden="true">
        <path class="brand-mark-blue" d="M12 2C12 2 5 10 5 15a7 7 0 0 0 7 7Z"/>
        <path class="brand-mark-pink" d="M12 2c0 0 7 8 7 13a7 7 0 0 1-7 7Z"/>
      </svg>
      <span class="brand-name">Bloodlines</span>
      <span class="brand-sep" aria-hidden="true">·</span>
      <span class="brand-sub">Central da Staff</span>
    </a>

    <div class="search" role="search" data-focus-host>
      <i class="ti ti-search search-icon" aria-hidden="true"></i>
      <label class="sr-only" for="search-input">Buscar procedimentos e regras</label>
      <input id="search-input" class="search-input" type="search" autocomplete="off" spellcheck="false"
             placeholder="Buscar procedimento, regra, comando ou tag">
      <kbd class="search-kbd" aria-hidden="true">Ctrl K</kbd>
    </div>

    <div class="user" id="user-slot"></div>
  </header>

  <div class="conn-banner" id="connection" role="status" hidden>
    <i class="ti ti-wifi-off" aria-hidden="true"></i>
    Sem conexão, alterações não serão salvas.
  </div>

  <div class="layout">
    <aside class="sidebar" id="sidebar" aria-label="Categorias"></aside>
    <main class="main" id="main" tabindex="-1"></main>
  </div>

  <a class="fab" href="#/novo" aria-label="Novo procedimento"><i class="ti ti-plus" aria-hidden="true"></i></a>
  <div class="toast-region" id="toast-region" role="status" aria-live="polite"></div>
</body>
</html>
